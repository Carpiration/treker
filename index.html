<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0e10">
<title>Задачи</title>
<meta name="description" content="Общий список задач команды: кто что делает и в каком статусе.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Задачи">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="config.js"></script>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-text" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4M10 16l4-4-4-4M14 12H4"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path d="M4 4l16 16"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c1.2-3.6 3.6-5.5 6.5-5.5s5.3 1.9 6.5 5.5M16 4.8a3.5 3.5 0 0 1 0 6.4M18.5 14.8c1.4.9 2.4 2.6 3 5.2"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20.5a2 2 0 0 0 4 0"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
  <symbol id="i-move" viewBox="0 0 24 24"><path d="M4 12h13M13 7l5 5-5 5"/><path d="M20 5v14"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></symbol>
  <symbol id="i-palette" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.2 0 2-.8 2-1.8 0-.5-.2-.9-.5-1.3-.3-.3-.5-.8-.5-1.2 0-1 .8-1.7 1.8-1.7H17a4 4 0 0 0 4-4C21 6.6 17 3 12 3z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="15" cy="7" r="1"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/></symbol>
  <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M3 13h5l1.5 3h5L16 13h5M5 5h14l2 8v6H3v-6z"/></symbol>
  <symbol id="s-todo" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.6" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
  <symbol id="s-doing" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.6" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M8 4.6a3.4 3.4 0 0 1 0 6.8z" fill="currentColor"/></symbol>
  <symbol id="s-done" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.4" fill="currentColor"/><path d="m5.3 8.2 1.8 1.8 3.6-3.8" fill="none" stroke="#0d0e10" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<!-- Загрузка и ошибка подключения -->
<div class="boot" id="boot" role="status"><span id="bootText">Загрузка…</span>
  <button class="btn" type="button" id="bootRetry" hidden>Повторить</button></div>

<!-- Вход и первый запуск -->
<div class="auth" id="authScreen" hidden>
  <form class="auth-box" id="loginForm" novalidate>
    <div class="brand"><img class="brand-mark" src="icons/icon.svg" alt="" width="28" height="28">Задачи</div>
    <h1 id="authH">Вход</h1>
    <p class="hint" id="authHint" hidden></p>
    <p class="note" id="authNote" role="status" hidden></p>
    <div id="loginFields" style="display:grid;gap:14px"></div>
    <div class="field-error" id="authErr" role="alert" hidden></div>
    <button class="btn primary block" type="submit" id="authBtn">Войти</button>
    <button class="btn ghost block" type="button" id="authSwitch">Нет профиля? Зарегистрироваться</button>
  </form>
</div>

<!-- Приложение -->
<div class="app" id="app" hidden>
  <header class="top" id="top">
    <div class="bar">
      <div id="whoSlot"></div>
      <span class="net" id="net" role="status" hidden>нет сети</span>
      <button class="icon-btn push bell" type="button" id="bellBtn" aria-label="Уведомления" title="Уведомления"><svg class="i" aria-hidden="true"><use href="#i-bell"/></svg><span class="bell-n" aria-hidden="true"></span></button>
      <button class="icon-btn dot-host" type="button" id="settingsBtn" aria-label="Меню" aria-haspopup="menu" aria-expanded="false" aria-controls="appMenu" title="Меню"><svg class="i" aria-hidden="true"><use href="#i-settings"/></svg></button>
      <div class="app-menu" id="appMenu" role="menu" aria-label="Меню" hidden></div>
    </div>
    <form class="composer" id="newForm" novalidate>
      <div class="c-box" id="cBox">
        <label class="sr-only" for="nTitle">Новая задача</label>
        <input class="c-title" id="nTitle" placeholder="Новая задача" maxlength="200" autocomplete="off" aria-describedby="nTitleErr">
        <!-- Описание: тонкая полоска с подсказкой (или началом текста); по клику раскрывается поле фиксированной высоты. -->
        <div class="c-desc" id="cDesc">
          <button type="button" class="c-peek" id="descPeek" aria-controls="nDesc" aria-expanded="false"><svg class="i" aria-hidden="true"><use href="#i-text"/></svg><span class="c-peek-tx" id="descPeekTx">Описание — необязательно</span></button>
          <div class="c-desc-wrap"><div>
            <label class="sr-only" for="nDesc">Описание</label>
            <textarea class="c-desc-in" id="nDesc" placeholder="Что именно, где, как проверить" maxlength="5000" tabindex="-1"></textarea>
          </div></div>
        </div>
      </div>
      <div class="c-side">
        <div id="nAssignSlot" hidden></div>
        <button class="btn primary c-add" type="submit" id="nSubmit" aria-label="Добавить задачу" title="Добавить (Enter)"><span class="c-add-tx" aria-hidden="true">Добавить</span></button>
      </div>
    </form>
    <div class="field-error" id="nTitleErr" hidden></div>
    <div class="filters">
      <div class="seg" id="viewSeg" role="radiogroup" aria-label="Какие задачи показать">
        <button type="button" class="seg-b on" role="radio" aria-checked="true" data-view="active">Активные</button>
        <button type="button" class="seg-b" role="radio" aria-checked="false" data-view="done">Готовые</button>
      </div>
      <div class="chips" id="chips" role="toolbar" aria-label="Фильтр задач" hidden></div>
    </div>
  </header>
  <main>
    <h2 class="sr-only" id="listTitle">Задачи</h2>
    <div class="list" id="list" aria-labelledby="listTitle"></div>
  </main>
</div>

<dialog id="settings" aria-labelledby="stH">
  <div class="dlg-head"><h2 id="stH">Настройки</h2>
    <button class="icon-btn" type="button" data-close aria-label="Закрыть"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button></div>
  <div class="dlg-body" id="stBody"></div>
</dialog>

<div class="menu-list ctx" id="ctx" role="menu" aria-label="Действия с задачей" hidden></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script src="js/core.js" defer></script>
<script src="js/backend.js" defer></script>
<script src="js/spaces.js" defer></script>
<script src="js/auth.js" defer></script>
<script src="js/menu.js" defer></script>
<script src="js/list.js" defer></script>
<script src="js/look.js" defer></script>
<script src="js/settings.js" defer></script>
<script src="js/activity.js" defer></script>
<script src="js/push.js" defer></script>
<script src="js/main.js" defer></script>
</body>
</html>
